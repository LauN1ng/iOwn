# iOS 构建闭环（构建路径定案 v1）：编译验证 + 模拟器截图回传 + 未签名 IPA
# Windows 本地零 Xcode 依赖：工程由 XcodeGen 在 runner 上生成
name: iOS Build

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick available simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -Eo '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | head -20

      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild -project iOwn.xcodeproj -scheme iOwn \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build build

      - name: Run in simulator & take screenshots
        run: |
          # 诊断：runner 网络能否访问 holiday-cn 各源（不阻断构建）
          echo "== holiday-cn reachability =="
          for u in \
            "https://cdn.jsdelivr.net/gh/NateScarlet/holiday-cn@master/2026.json" \
            "https://fastly.jsdelivr.net/gh/NateScarlet/holiday-cn@master/2026.json" \
            "https://raw.githubusercontent.com/NateScarlet/holiday-cn/master/2026.json" ; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 12 "$u" || echo "ERR")
            echo "  $code  $u"
          done
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          APP=build/Build/Products/Debug-iphonesimulator/iOwn.app
          BID=com.iown.app
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP"
          mkdir -p ../artifacts
          # 1) 首页流水（注入样例数据）
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" "$BID" -ci-demo-data
          sleep 6
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ../artifacts/01-home.png
          # 2) 记一笔 sheet（阶段 1 宫格）
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" "$BID" || true
          sleep 1
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" "$BID" -ci-open-sheet
          sleep 6
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ../artifacts/02-entry.png
          # 3) 成功屏（CI 模式常驻不自动返回）
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" "$BID" || true
          sleep 1
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" "$BID" -ci-show-done
          sleep 6
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ../artifacts/03-done.png
          # 4) 资产页（M2：净资产卡+四指标+账户组，注入样例账户）
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" "$BID" || true
          sleep 1
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" "$BID" -ci-demo-data -ci-tab-assets
          sleep 6
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ../artifacts/04-assets.png
          # 5) 建户半屏 sheet（验证 .fraction(0.68) detents 与表单不裁切）
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" "$BID" || true
          sleep 1
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" "$BID" -ci-demo-data -ci-open-account
          sleep 6
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ../artifacts/05-account.png
          # 6) 金额键盘页（验证金额两位小数显示 + 账户 chip 联动）
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" "$BID" || true
          sleep 1
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" "$BID" -ci-demo-data -ci-open-amount
          sleep 6
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ../artifacts/06-entry-amount.png
          # 7) 大字号（Dynamic Type）：-ci-large-text 强制 .xxxLarge，验证缩放生效且版式不炸
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" "$BID" || true
          sleep 1
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" "$BID" -ci-demo-data -ci-large-text
          sleep 6
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ../artifacts/07-home-large-text.png
          # 8) 分类管理页（E5/A5：预设只读 + 自定义子类增删）
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" "$BID" || true
          sleep 1
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" "$BID" -ci-demo-data -ci-open-catman
          sleep 6
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ../artifacts/08-category.png
          # 9) 洞察页（D2：月份卡+12月柱状图 / 日历热力格+心情账单 / 分类占比）
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" "$BID" || true
          sleep 1
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" "$BID" -ci-demo-data -ci-tab-insight
          sleep 6
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ../artifacts/09-insight.png
          # 10) 洞察页滚到底（验证分类占比卡不被悬浮 TabBar + FAB 遮挡）
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" "$BID" || true
          sleep 1
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" "$BID" -ci-demo-data -ci-tab-insight -ci-insight-bottom
          sleep 6
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ../artifacts/10-insight-bottom.png
          # 11) 工资设置页（v1.6：到手薪资 + 调休节）
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" "$BID" || true
          sleep 1
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" "$BID" -ci-demo-data -ci-open-wage
          sleep 6
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ../artifacts/11-wage-settings.png
          # 12) 工资设置页滚到「节假日数据」（核对 holiday-cn 同步结果 + 调休节渲染）
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" "$BID" || true
          sleep 1
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" "$BID" -ci-demo-data -ci-open-wage -ci-wage-bottom
          sleep 8
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ../artifacts/12-wage-holiday.png
          # 诊断：读 app UserDefaults，确认 holiday-cn 是否写入缓存
          echo "== app UserDefaults (holiday) =="
          APP_DATA=$(xcrun simctl get_app_container "${{ steps.sim.outputs.udid }}" "$BID" data 2>/dev/null || true)
          echo "container: $APP_DATA"
          plutil -p "$APP_DATA/Library/Preferences/$BID.plist" 2>/dev/null | grep -i holiday || echo "  (no holiday keys)"
          # 13) 信用账户详情（= 原「负债页」：绿卡 + 只读当期欠款 + 分期笔 + 还款）
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" "$BID" || true
          sleep 1
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" "$BID" -ci-demo-data -ci-tab-assets -ci-open-credit
          sleep 8
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ../artifacts/13-credit-detail.png
          # 14) 固定支出 / 订阅（独立模块：明确"不是负债"）
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" "$BID" || true
          sleep 1
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" "$BID" -ci-demo-data -ci-tab-assets -ci-open-fixed
          sleep 8
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ../artifacts/14-fixed-expense.png
          # 15) 添加分期（半屏：我知道本金 / 我只知道每期 两种输入模式 + 试算）
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" "$BID" || true
          sleep 1
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" "$BID" -ci-demo-data -ci-open-installment
          sleep 6
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ../artifacts/15-installment-add.png
          # 16) 记一笔 · 选中信用账户（D18：全额下期 / 分期 N 期 + 年化试算）
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" "$BID" || true
          sleep 1
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" "$BID" -ci-demo-data -ci-open-credit-pay
          sleep 6
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ../artifacts/16-entry-credit-pay.png
          # 17) 首页（「本月可支配」新口径：信用应还 + 固定支出）
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" "$BID" || true
          sleep 1
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" "$BID" -ci-demo-data
          sleep 6
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ../artifacts/17-home-disposable.png
          # 18) 行为自检（-ci-selftest）：在独立内存容器里跑真实写路径并断言
          #     （全额下期不建负债 / 分期换算 / 不双计 / 改账联动 / 还款结清 / 删账回滚）
          #     编译与截图证明不了"算得对不对"，这一屏才是。
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" "$BID" || true
          sleep 1
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" "$BID" -ci-selftest
          sleep 6
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ../artifacts/18-selftest.png
          # 19) 现金账户详情页（2026-10-11 新增：hero 卡面 + 余额/转账/编辑 + 该账户流水）
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" "$BID" || true
          sleep 1
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" "$BID" -ci-demo-data -ci-tab-assets -ci-open-cash
          sleep 8
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ../artifacts/19-account-cash.png
          # 20) 添加账户（图标预览 + 类型 + 图标/名称/备注/卡号后四位 + 记账时可选择）
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" "$BID" || true
          sleep 1
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" "$BID" -ci-demo-data -ci-tab-assets -ci-open-account
          sleep 8
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ../artifacts/20-account-add.png
          # 21) 图标选择器（通用 Fluent 3D + 品牌真实 logo，分组展示）
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" "$BID" || true
          sleep 1
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" "$BID" -ci-demo-data -ci-tab-assets -ci-open-account -ci-open-icon
          sleep 9
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ../artifacts/21-icon-picker.png
          # 22) 添加固定支出（sheet：固定头部 + Fluent 3D 图标网格 + 卡片式表单）
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" "$BID" || true
          sleep 1
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" "$BID" -ci-demo-data -ci-tab-assets -ci-open-fixed -ci-open-fixed-add
          sleep 9
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ../artifacts/22-fixed-add.png
          # 23) 分期总览（「债有尽头」—— DebtEngine.forecast 终于接上界面）
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" "$BID" || true
          sleep 1
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" "$BID" -ci-demo-data -ci-tab-assets -ci-open-installments
          sleep 9
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ../artifacts/23-installment-overview.png
          # TODO(M4): 动效验证改用 xcrun simctl io ... recordVideo

      - name: Build unsigned IPA (Release, device)
        run: |
          set -o pipefail
          xcodebuild -project iOwn.xcodeproj -scheme iOwn \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build-device build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -r build-device/Build/Products/Release-iphoneos/iOwn.app Payload/
          zip -qr ../artifacts/iOwn-unsigned.ipa Payload
          # Windows 端：Sideloadly + 免费 Apple ID 签名后侧载（7 天有效）

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: artifacts/*.png
          if-no-files-found: error

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: artifacts/iOwn-unsigned.ipa
          if-no-files-found: error
